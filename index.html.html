<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Dungeon Sector</title>

  <style>
    :root {
      --floor: #59443d;
      --floor-dark: #2e2420;
      --camera-duration: 2.4s;   /* было 3.4s — на секунду быстрее */
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      margin: 0; overflow: hidden;
      background: var(--floor-dark);
    }

    body { font-family: Georgia, serif; }

    .viewport {
      position: fixed; inset: 0;
      overflow: hidden;
      perspective: 1050px;
      perspective-origin: 50% 50%;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 63%, rgba(180, 130, 95, .18), transparent 62%),
        linear-gradient(to bottom, #241b18 0%, #2e2420 52%, #211916 100%);
    }

    .scene {
      position: absolute;
      width: 100%; height: 100%;
      left: 0; top: 0;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      animation: cameraMove var(--camera-duration) cubic-bezier(.18, .76, .22, 1) forwards;
      will-change: transform;
    }

    @keyframes cameraMove {
      0%   { transform: translate3d(0, -5vh, -25px) rotateX(-22deg) scale(1.03); }
      100% { transform: translate3d(0, 4vh, 90px)  rotateX(0deg) scale(1.07); }
    }

    .crowd {
      position: absolute;
      inset: -18vh -10vw;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .character {
      position: absolute;
      left: 0; top: 0;
      width: clamp(105px, 10.8vw, 178px);
      aspect-ratio: .62;
      transform-style: preserve-3d;
      transform:
        translate3d(var(--x), var(--y), var(--z))
        rotate(var(--r))
        scale(var(--s, 1));
      transform-origin: bottom center;
      z-index: var(--depth, 1);
      will-change: transform;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      border-radius: 45% 45% 24% 24%;
      background:
        linear-gradient(150deg, rgba(255,255,255,.16), transparent 45%),
        var(--color);
      box-shadow:
        0 14px 24px rgba(25, 12, 8, .25),
        inset 0 -8px 14px rgba(0,0,0,.08);
    }
    .placeholder::before {
      content: "";
      position: absolute;
      width: 67%; aspect-ratio: 1;
      left: 16.5%; top: -15%;
      border-radius: 50%;
      background: var(--head);
      box-shadow: inset 0 -5px 8px rgba(50,20,10,.08);
    }
    .placeholder::after {
      content: "";
      position: absolute;
      width: 24%; height: 11%;
      left: 38%; top: 32%;
      border-radius: 50%;
      background: rgba(25, 15, 13, .35);
    }

    .second {
      filter: grayscale(.78) sepia(.28) blur(2.8px);
    }

    .entrance {
      position: fixed;
      z-index: 2000;
      left: 50%; top: 50%;
      width: min(215px, 58vw);
      height: 82px;
      padding: 0;
      display: grid; place-items: center;
      transform: translate(-50%, -50%) scale(.84);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      outline: none;
      border-radius: 18px;
      color: #f2e5d0;
      font-family: Georgia, serif;
      font-size: clamp(25px, 3.2vw, 34px);
      letter-spacing: .09em;

      background: rgba(95, 92, 90, 0.32);
      backdrop-filter: blur(22px) saturate(1.05);
      -webkit-backdrop-filter: blur(22px) saturate(1.05);

      box-shadow:
        0 18px 45px rgba(24, 13, 9, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 -1px 0 rgba(0, 0, 0, 0.20);

      cursor: pointer;
      transition: background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    /* Кнопка появляется раньше — сразу после конца камеры (камера идёт 2.4s вместо 4.4s) */
    .entrance.ready {
      visibility: visible;
      pointer-events: auto;
      animation: entranceIn .32s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .entrance:hover {
      background: rgba(120, 116, 112, 0.42);
      box-shadow:
        0 20px 52px rgba(24, 13, 9, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.24);
    }

    .entrance:active {
      transform: translate(-50%, -50%) scale(.97);
    }

    @keyframes entranceIn {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.84); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @media (max-width: 700px) {
      .viewport { perspective: 760px; }
      .scene { animation-name: cameraMoveMobile; }
      .crowd { inset: -16vh -20vw; }
      .character { width: 128px; }
      .entrance { width: 200px; height: 76px; }
    }

    @keyframes cameraMoveMobile {
      0%   { transform: translate3d(0, -6vh, -22px) rotateX(-20deg) scale(1.03); }
      100% { transform: translate3d(0, 3vh, 70px)  rotateX(0deg) scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene {
        animation: none;
        transform: translate3d(0, 4vh, 90px) rotateX(0deg) scale(1.07);
      }
      .entrance {
        visibility: visible;
        pointer-events: auto;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="viewport">
    <main class="scene" id="scene">
      <div class="crowd" id="crowd"></div>
    </main>
  </div>

  <button class="entrance" id="entrance" type="button" aria-label="Войти в фандом">
    Войти
  </button>

  <script>
    const crowd = document.getElementById("crowd");
    const scene = document.getElementById("scene");
    const entrance = document.getElementById("entrance");

    const palette = [
      ["#e94f8a", "#ffbd83"], ["#42d9a3", "#f0ad78"], ["#f4d343", "#eaa77b"],
      ["#7658e8", "#efb18b"], ["#ff7048", "#e8a57a"], ["#31bce8", "#f1b587"],
      ["#d94ee8", "#e7a47c"], ["#4ec9a8", "#eeb487"], ["#36d6c0", "#edb183"],
      ["#f05b43", "#e6a47c"], ["#a84fe4", "#efb589"], ["#39d96e", "#efb187"],
      ["#ed4fbd", "#dfa07b"], ["#4d9df2", "#efb287"], ["#f07b36", "#e4a078"]
    ];

    function noise(seed) {
      const x = Math.sin(seed * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    }

    function createCharacter({ x, y, z, rotation, scale, depth, color, head, second = false }) {
      const el = document.createElement("div");
      el.className = "character" + (second ? " second" : "");
      el.style.setProperty("--x", `${x}px`);
      el.style.setProperty("--y", `${y}px`);
      el.style.setProperty("--z", `${z}px`);
      el.style.setProperty("--r", `${rotation}deg`);
      el.style.setProperty("--s", scale);
      el.style.setProperty("--depth", depth);
      el.style.setProperty("--color", color);
      el.style.setProperty("--head", head);
      el.innerHTML = '<div class="placeholder"></div>';
      crowd.appendChild(el);
      return el;
    }

    function buildCrowd() {
      crowd.replaceChildren();

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const characterWidth = Math.max(120, Math.min(180, vw * 0.108));
      const columnStep = characterWidth * 0.78;
      const rowStep = Math.max(90, Math.min(130, vh * 0.13));

      const left = -characterWidth * 1.35;
      const top = -vh * 0.12;
      const right = vw + characterWidth * 1.35;
      const bottom = vh * 1.18;

      const columns = Math.ceil((right - left) / columnStep) + 1;
      const rows = Math.ceil((bottom - top) / rowStep) + 1;

      const secondCol = Math.round((columns - 1) / 2);
      const secondRow = Math.round((rows - 1) / 2);

      let id = 0;

      for (let row = 0; row < rows; row++) {
        const rowY = top + row * rowStep;
        const offset = (row % 2) * columnStep * 0.5;

        const progress = row / Math.max(1, rows - 1);
        const z = -620 + progress * 820;

        for (let col = -1; col < columns + 1; col++) {
          const x = left + col * columnStep + offset;

          const seed = row * 1000 + col;

          const jitterX = (noise(seed + 1) - .5) * columnStep * .28;
          const jitterY = (noise(seed + 2) - .5) * rowStep * .26;
          const rotation = (noise(seed + 3) - .5) * 13;

          const sizeBoost = 0.88 + progress * 0.32;
          const wave = Math.sin(col * 0.9 + row * 1.4) * 0.06;
          const scale = (0.94 + noise(seed + 4) * 0.14 + wave) * sizeBoost;

          if (row === secondRow && col === secondCol) {
            id++;
            continue;
          }

          const isAroundSecond =
            Math.abs(row - secondRow) <= 1 &&
            Math.abs(col - secondCol) <= 1;

          const localBoost = isAroundSecond ? 1.04 : 1;
          const ySink = isAroundSecond ? rowStep * 0.10 : 0;

          const pair = palette[id % palette.length];

          createCharacter({
            x: x + jitterX,
            y: rowY + jitterY + ySink,
            z: z + (noise(seed + 5) - .5) * 50,
            rotation,
            scale: scale * localBoost,
            depth: 10 + row,
            color: pair[0],
            head: pair[1]
          });

          id++;
        }
      }

      const secondOffset = (secondRow % 2) * columnStep * 0.5;
      const secondX = left + secondCol * columnStep + secondOffset;
      const secondY = top + secondRow * rowStep;
      const secondProgress = secondRow / Math.max(1, rows - 1);
      const secondZ = -620 + secondProgress * 820;

      createCharacter({
        x: secondX,
        y: secondY + rowStep * 0.10,
        z: secondZ,
        rotation: -3,
        scale: 0.94 + secondProgress * 0.32,
        depth: 10 + secondRow,
        color: "#66534a",
        head: "#80675a",
        second: true
      });
    }

    scene.addEventListener("animationend", (event) => {
      if (event.animationName === "cameraMove" ||
          event.animationName === "cameraMoveMobile") {
        entrance.classList.add("ready");
      }
    });

    entrance.addEventListener("click", () => {
      console.log("Вход в фандом");
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildCrowd, 120);
    });

    buildCrowd();
  </script>
</body>
</html>
